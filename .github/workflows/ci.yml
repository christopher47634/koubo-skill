name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 类型检查
        run: npm run typecheck
      - name: 时间轴 lint
        run: npm run lint:timeline
      - name: 单元测试
        run: npm test
